{em:"\uD83D\uDC95",t:"90s Rom-Com Walk",d:"Robin Williams in drag to Ali Wong.",dist:"1.8 mi",time:"35 min",spd:"Doubtfire ran this in heels. 27-sec mile.",stops:[{m:"Mrs. Doubtfire",l:"2640 Steiner"},{m:"Always Be My Maybe",l:"UN Plaza"},{m:"Blue Jasmine",l:"Post St"}]},
{em:"\uD83E\uDDB8",t:"Action Hero Chase",d:"Bay views + explosions.",dist:"2.1 mi",time:"40 min",spd:"Cage: 45 sec. 168 mph in a Humvee.",stops:[{m:"Bullitt",l:"Taylor St"},{m:"Ant-Man",l:"Lombard"},{m:"Venom",l:"Embarcadero"}]},
{em:"\uD83C\uDFAC",t:"Golden Age Noir",d:"Bogart. Bacall. Fog. Fedoras.",dist:"1.9 mi",time:"35 min",spd:"Bogart: 1.8 mph. Slowly.",stops:[{m:"Dark Passage",l:"1360 Montgomery"},{m:"Vertigo",l:"Fort Point"},{m:"Inferno",l:"Fairmont"}]},
{em:"\uD83C\uDF09",t:"Is This Really SF?",d:"Where Hollywood got it wrong.",dist:"3.1 mi",time:"55 min",spd:"Matrix closed 4 blocks for 9 days.",stops:[{m:"Matrix",l:"Market St"},{m:"Ant-Man",l:"Lombard"},{m:"Inside Out",l:"GG Bridge"}]}];
const TR=[{q:"Eastwood film at Bank of America?",o:["Dirty Harry","Unforgiven","Gran Torino","In the Line of Fire"],a:0},{q:"Tom Hanks at Palace of Fine Arts?",o:["Cast Away","Philadelphia","Forrest Gump","Green Mile"],a:2},{q:"Fairmont Hotel fire scene?",o:["Towering Inferno","San Andreas","Earthquake","Backdraft"],a:0},{q:"Bullitt Marina\u2192Vis Valley?",o:["2 mi","5 mi","8 mi","12 mi"],a:2},{q:"Bullitt continuity error car?",o:["Red Corvette","Green VW Bug","Yellow Taxi","Blue Chevy"],a:1},{q:"Mrs. Doubtfire house street?",o:["Lombard","Haight","Steiner","Fillmore"],a:2},{q:"Hitchcock at Fort Point?",o:["Psycho","Rear Window","Birds","Vertigo"],a:3},{q:"Sean Penn as Milk?",o:["Transamerica","City Hall","Ferry Bldg","Palace Hotel"],a:1},{q:"Keanu 2019 rom-com?",o:["To All Boys","Set It Up","Always Be My Maybe","Someone Great"],a:2},{q:"Largest permit ($185K)?",o:["Venom","The Rock","Matrix Resurrections","Ant-Man"],a:2},{q:"Bullitt teleport speed?",o:["2,520 MPH","5,580 MPH","9,840 MPH","15,000 MPH"],a:2},{q:"Pixar $0 permits?",o:["Cars","Up","Inside Out","Monsters Inc"],a:2}];
let tab='explore',flt='All',src='',mp=null,mks=[],tI=0,tS=0,tD=false,showLive=false;
const hoods=[...new Set(D.filter(d=>d.hood).map(d=>d.hood))].sort();
const TD=[{id:'explore',ic:'\uD83C\uDFAC',lb:'Explore'},{id:'audit',ic:'\uD83D\uDD0D',lb:'Audits'},{id:'walks',ic:'\uD83D\uDEB6',lb:'Walks'},{id:'ai',ic:'\uD83E\uDD16',lb:'AI'},{id:'trivia',ic:'\uD83C\uDFAF',lb:'Trivia'}];

function iT(){document.getElementById('T').innerHTML=TD.map(t=>`<button class="tb${t.id===tab?' on':''}" onclick="tab='${t.id}';iT();go()">${t.ic} ${t.lb}</button>`).join('')}
function go(){const w=document.getElementById('W');w.scrollTop=0;if(tab==='explore')rE(w);else if(tab==='audit')rA(w);else if(tab==='walks')rW(w);else if(tab==='ai')rI(w);else rT(w)}

function cI(isCam){
  const c=isCam?'%23d44a3a':'%23c8a44a';
  return L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-14],
    html:'<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="'+decodeURIComponent(c)+'" stroke="#fff" stroke-width="2"/><rect x="6" y="9" width="8" height="6" rx="1" fill="#fff" opacity="0.9"/><polygon points="14,10 18,8 18,16 14,14" fill="#fff" opacity="0.9"/></svg>'})
}
function lI(){
  return L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14],
    html:'<svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="#d44a3a" stroke="#fff" stroke-width="2"/><circle cx="14" cy="14" r="11" fill="none" stroke="#d44a3a" stroke-width="1.5" opacity="0.4"><animate attributeName="r" from="11" to="18" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.5" to="0" dur="1.5s" repeatCount="indefinite"/></circle><text x="14" y="17" text-anchor="middle" fill="#fff" font-size="7" font-weight="bold" font-family="DM Sans,sans-serif">LIVE</text></svg>'})
}

function pH(d){return `<div class="pop"><div class="pt">${d.t}<span class="py">${d.y}</span></div><div class="pl">\uD83C\uDFA5 ${d.loc}</div><div class="pc">${d.cast.join(', ')} \u00B7 ${d.dir}</div>${d.fact?`<div class="pf">${d.fact}</div>`:''}${d.permit?`<div class="pp">\uD83D\uDCB0 ${d.permit} \u2014 ${d.pn}</div>`:''}${d.cam?`<div class="pe">\uD83C\uDFAD ${d.cam}</div>`:''}<div class="ph">${d.hood||''}</div><div class="svr" onmousedown="sS(event,this)" ontouchstart="sS(event,this)"><div class="svs svr2"><span class="svlb">Now</span><div class="svtx">\uD83D\uDCF7</div></div><div class="svs svl" style="width:50%"><span class="svlb">Cinema</span><div class="svtx">\uD83C\uDFAC ${d.t}</div></div><div class="svd" style="left:50%"></div></div></div>`}

function sS(e,el){e.preventDefault();const mv=ev=>{const r=el.getBoundingClientRect();const cx=ev.touches?ev.touches[0].clientX:ev.clientX;let p=((cx-r.left)/r.width)*100;p=Math.max(5,Math.min(95,p));el.querySelector('.svl').style.width=p+'%';el.querySelector('.svd').style.left=p+'%'};const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up)};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);document.addEventListener('touchmove',mv);document.addEventListener('touchend',up)}

function rE(el){
  const ch=['All',...hoods].map(h=>`<button class="ch ${flt===h?'on':''}" onclick="flt='${h.replace(/'/g,"\\'")}';uM()">${h}</button>`).join('');
  el.innerHTML=`<div class="sr"><input type="text" placeholder="Search movies, actors, locations..." value="${src}" oninput="src=this.value;uM()"></div><div class="chips">${ch}</div><div class="lt${showLive?' on':''}" onclick="showLive=!showLive;rE(document.getElementById('W'))"><div class="ld"></div><div><div class="ltx">${showLive?'\uD83D\uDD34 Active Filming':'Active Filming'}</div><div class="lts">${showLive?'Showing active productions':'Tap to show active permits'}</div></div></div>${showLive?AF.map(f=>`<div class="lb"><div class="lbg">\uD83D\uDD34 LIVE</div><h4>${f.t} (${f.y})</h4><p>${f.dir} \u00B7 ${f.cast.join(', ')}</p><p>${f.desc}</p><p style="color:var(--gd);margin-top:.2rem">\uD83D\uDCB0 ${f.permit} \u00B7 ${f.note}</p></div>`).join(''):''}<button class="btn br" onclick="rnd()">\uD83C\uDFB2 Random Scene</button><div id="mapBox"></div><div class="cnt" id="cL"></div>`;
  setTimeout(()=>{if(mp){mp.remove();mp=null}const b=document.getElementById('mapBox');if(!b)return;mp=L.map('mapBox',{zoomControl:true,attributionControl:false}).setView([37.76,-122.44],12);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(mp);uM()},50);
}
function uM(){
  if(!mp)return;mks.forEach(m=>mp.removeLayer(m));mks=[];
  const f=D.filter(d=>{if(!d.lat)return false;const mh=flt==='All'||d.hood===flt;const ms=!src||d.t.toLowerCase().includes(src.toLowerCase())||d.loc.toLowerCase().includes(src.toLowerCase())||d.cast.some(a=>a.toLowerCase().includes(src.toLowerCase()));return mh&&ms});
  f.forEach(d=>{const m=L.marker([d.lat,d.lng],{icon:cI(!!d.cam)}).addTo(mp);m.bindPopup(pH(d),{maxWidth:280});mks.push(m)});
  if(showLive){AF.forEach(af=>{af.locs.forEach(loc=>{const m=L.marker([loc.lat,loc.lng],{icon:lI()}).addTo(mp);m.bindPopup(`<div class="pop"><div class="pt" style="color:var(--rd)">${af.t}<span class="py">${af.y}</span></div><div class="pl" style="color:var(--rd)">\uD83D\uDD34 ${loc.n}</div><div class="pc">${af.dir} \u00B7 ${af.cast.join(', ')}</div><div class="pp" style="color:var(--rd)">${af.status}</div></div>`);mks.push(m)})})}
  const cl=document.getElementById('cL');if(cl)cl.textContent=`${f.length} scenes`+(showLive?` + ${AF.reduce((s,a)=>s+a.locs.length,0)} active`:'');
}
function rnd(){const c=D.filter(d=>d.lat);const p=c[Math.floor(Math.random()*c.length)];mp.flyTo([p.lat,p.lng],16,{duration:1});setTimeout(()=>{const m=mks.find(mk=>{const ll=mk.getLatLng();return Math.abs(ll.lat-p.lat)<.001&&Math.abs(ll.lng-p.lng)<.001});if(m)m.openPopup()},1100)}
function rA(el){const tt=AU.reduce((s,a)=>s+a.steps.length,0);const mx=Math.max(...AU.flatMap(a=>a.steps.map(s=>s.mph)));el.innerHTML=`<div class="sc">\uD83D\uDD0D Geographic Integrity Audits</div><div class="ss">Hollywood thinks SF is 3 blocks wide.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.8rem"><div style="background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:.6rem;text-align:center"><div class="sn">${tt}</div><div class="sl">Teleportations</div></div><div style="background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:.6rem;text-align:center"><div class="sn">${mx.toLocaleString()}</div><div class="sl">Peak MPH</div></div></div>${AU.map((a,i)=>`<div class="ac" id="a${i}"><div class="aH" onclick="document.getElementById('a${i}').classList.toggle('open')"><div class="aM">${a.m}<span class="aY">${a.y}</span></div><div class="aTag">${a.tag}</div><div class="aBg">\u26A1 ${a.steps.length} impossible cut${a.steps.length>1?'s':''}</div></div><div class="aB">${a.steps.map(s=>`<div class="aS"><div class="aR"><strong>${s.f}</strong> \u2192 <strong>${s.t}</strong></div><div class="aX"><h4>\u26A1 IMPOSSIBLE</h4><p>${s.d}</p><div style="margin-top:.3rem"><div class="aXl">${s.mi} mi \u00B7 ${s.s}s</div><div class="aXn">${s.mph.toLocaleString()} MPH</div><div class="aXl">Required speed</div></div></div></div>`).join('')}</div></div>`).join('')}`}

function rW(el){el.innerHTML=`<div class="sc">\uD83D\uDEB6 Main Character Walking Tours</div><div class="ss">Speed comparisons to remind you: not an action hero.</div>${WK.map((w,i)=>`<div class="wc" id="w${i}" onclick="document.getElementById('w${i}').classList.toggle('open')"><div class="we">${w.em}</div><div class="wt">${w.t}</div><div class="wd">${w.d}</div><div class="wm"><span>\uD83D\uDCCD ${w.stops.length} stops</span><span>\uD83D\uDEB6 ${w.dist}</span><span>\u23F1 ${w.time}</span></div><div class="wj">\uD83C\uDFCE\uFE0F ${w.spd}</div><div class="wS">${w.stops.map((s,j)=>`<div class="ws"><div class="wn">${j+1}</div><div><div class="wMv">${s.m}</div><div class="wLc">${s.l}</div></div></div>`).join('')}</div></div>`).join('')}`}

function rI(el){const V=['\uD83C\uDF2B\uFE0F Foggy noir','\uD83C\uDF09 Golden hour','\uD83C\uDFD9\uFE0F Chase','\uD83C\uDF03 Thriller','\u2600\uFE0F Indie','\uD83C\uDFAD Political'];el.innerHTML=`<div class="sc">\uD83E\uDD16 AI Scene Advisor</div><div class="ss">Describe any SF spot for a cinematic match.</div><div class="aib"><div class="ait">What should be filmed here?</div><div class="aid">Describe a vibe, a view, a mood.</div><textarea class="ata" id="aIn" placeholder="A foggy alley in Chinatown at 2am..."></textarea><button class="btn bg" style="margin-top:.4rem" onclick="runAI()">\uD83C\uDFAC Analyze</button><div class="air" id="aR"></div></div><div class="aib"><div class="ait">\uD83C\uDFAF Quick Vibe Match</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:.25rem">${V.map(v=>`<button class="ch" onclick="qV('${v}')" style="font-size:.6rem;padding:.25rem .55rem">${v}</button>`).join('')}</div><div class="air" id="qR"></div></div>`}
function runAI(){const inp=document.getElementById('aIn').value.trim();if(!inp)return;const r=document.getElementById('aR');r.className='air show';r.innerHTML='\uD83C\uDFAC Analyzing...';setTimeout(()=>{const l=inp.toLowerCase();let x;if(l.includes('fog')||l.includes('noir')||l.includes('dark'))x='<strong>Vibe: Neo-Noir</strong><br><br>Fincher territory. <em>Zodiac</em> (2007).<br><br><strong>Nearby:</strong> Dark Passage (1947), Zodiac';else if(l.includes('bridge')||l.includes('sunset'))x='<strong>Vibe: Golden Hour</strong><br><br>Hitchcock invented this in <em>Vertigo</em>.<br><br><strong>Nearby:</strong> Forrest Gump (1994)';else if(l.includes('chase')||l.includes('hill'))x='<strong>Vibe: High-Octane</strong><br><br>McQueen started it. Hills = effects.<br><br><strong>Nearby:</strong> Bullitt (1968), The Rock';else if(l.includes('mission')||l.includes('indie'))x='<strong>Vibe: Sundance</strong><br><br><em>Last Black Man in SF</em> = poetry.';else x='<strong>Vibe: Classic SF</strong><br>75 years of film echo here.<br><strong>Nearby:</strong> '+D.slice(0,3).map(d=>d.t+' ('+d.y+')').join(', ');r.innerHTML=x},700)}
function qV(v){const r=document.getElementById('qR');r.className='air show';const m={'\uD83C\uDF2B\uFE0F Foggy noir':'<strong>Zodiac (2007)</strong> \u2014 Fincher waited for real fog.','\uD83C\uDF09 Golden hour':'<strong>Vertigo (1958)</strong> \u2014 Hitchcock at the bridge.','\uD83C\uDFD9\uFE0F Chase':'<strong>Bullitt (1968)</strong> \u2014 9,840 MPH impossible physics.','\uD83C\uDF03 Thriller':'<strong>Dark Passage (1947)</strong> \u2014 Noir was made for SF.','\u2600\uFE0F Indie':'<strong>Last Black Man in SF</strong> \u2014 Won Sundance.','\uD83C\uDFAD Political':'<strong>Milk (2008)</strong> \u2014 City Hall is a character.'};r.innerHTML=m[v]||''}

function rT(el){const q=TR[tI];el.innerHTML=`<div style="text-align:center;margin-bottom:.5rem"><div style="font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:.12em">Q ${tI+1} / ${TR.length}</div><div style="font-family:var(--fd);font-size:1.3rem;color:var(--gd);margin-top:.05rem">Score: ${tS}</div></div><div class="tc"><div class="tq">${q.q}</div>${q.o.map((o,i)=>`<div class="to" id="t${i}" onclick="aT(${i})">${o}</div>`).join('')}<div id="tR" style="margin-top:.4rem;font-size:.75rem;font-weight:600;min-height:1rem"></div></div>${tD?`<button class="btn bo" onclick="nT()" style="margin-top:.4rem">${tI<TR.length-1?'Next \u2192':'Final Score'}</button>`:''}`}
function aT(s){if(tD)return;tD=true;const q=TR[tI],r=document.getElementById('tR');if(s===q.a){tS++;document.getElementById('t'+s).classList.add('ok');r.innerHTML='<span style="color:#5dda89">\uD83C\uDFAC Correct!</span>'}else{document.getElementById('t'+s).classList.add('no');document.getElementById('t'+q.a).classList.add('ok');r.innerHTML='<span style="color:var(--rd)">\u2716 '+q.o[q.a]+'</span>'}go()}
function nT(){if(tI<TR.length-1){tI++;tD=false;go()}else{const w=document.getElementById('W');const p=Math.round(tS/TR.length*100);const m=p===100?'Perfect. \uD83C\uDFC6':p>=75?'Impressive. \uD83C\uDFAC':p>=50?'Decent. \uD83C\uDF7F':'Try the Walks.';w.innerHTML=`<div class="tc" style="padding:1.5rem"><div style="font-size:2rem;margin-bottom:.3rem">\uD83C\uDFAC</div><div class="tq" style="font-size:1.1rem">${tS}/${TR.length}</div><div style="font-size:.75rem;color:var(--dim);margin-top:.2rem">${m}</div><button class="btn bo" onclick="tI=0;tS=0;tD=false;go()" style="margin-top:.8rem">Play Again</button></div>`}}
iT();go();
</script></body></html>
